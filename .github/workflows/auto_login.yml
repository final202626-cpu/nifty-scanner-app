name: Daily Fyers Auto Login

on:
  schedule:
    - cron: '25 3 * * 1-5'
  workflow_dispatch:

jobs:
  fyers-login:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pyotp fyers-apiv3

      - name: Generate Token
        run: python generate_token.py

      - name: Safe Push To GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pehle token ko locally save (commit) karo
          git add fyers_token.txt
          git commit -m "Auto Update Token" || echo "No changes to commit"
          
          # Nayi files ko pull karke apne token ko sabse upar (rebase) rakho
          git pull origin main --rebase
          
          # Ab safely push karo (Koi rejection nahi hoga)
          git push origin main
