name: Daily Fyers Auto Login

on:
  schedule:
    - cron: '25 3 * * 1-5'
  workflow_dispatch:

jobs:
  fyers-login:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Actions ko file save karne ki poori permission deta hai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pyotp fyers-apiv3

      - name: Generate Fyers Token
        run: python generate_token.py

      - name: Automatically Commit and Push Token
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto Updated Daily Fyers Token"
          file_pattern: fyers_token.txt
