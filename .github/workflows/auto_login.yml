name: Daily Fyers Auto Login

on:
  schedule:
    - cron: '25 3 * * 1-5'
  workflow_dispatch:

jobs:
  fyers-login:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pyotp fyers-apiv3

      - name: Generate Token
        run: python generate_token.py

      - name: Magic Auto-Commit Plugin (No Git Errors)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto Update Fyers Token"
          file_pattern: "fyers_token.txt"
